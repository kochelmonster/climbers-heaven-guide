description-en: >
  <h2>Durmitor</h2>
  Durmitor is a mountain and national park in Montenegro. It is believed that the name Durmitor comes from Balkan Romance (Vlach) word "Dormitor" which means "Sleeping". The highest peak, Bobotov Kuk, reaches a height of 2,523 meters.
