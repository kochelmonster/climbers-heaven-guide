<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/svgedit@7.4.2/dist/editor/images/logo.svg">
    <style id="styleoverrides" media="screen"></style>
    <link href="https://cdn.jsdelivr.net/npm/svgedit@7.4.2/dist/editor/svgedit.css" rel="stylesheet" media="all">
    <script type="module" src="https://cdn.jsdelivr.net/npm/svgedit@7.4.2/dist/editor/browser-not-supported.js"></script>
    <title>SVG-edit</title>
</head>
<body style="margin:0">
    <div id="container" style="width:100%;height:100vh"></div>
    <noscript>SVG-Edit requires JavaScript.</noscript>
    <script type="module">
        import Editor from 'https://cdn.jsdelivr.net/npm/svgedit@7.4.2/dist/editor/Editor.js'
        import { applySvgEditPatch } from './svgedit-patch.js'

        const svgEditor = new Editor(document.getElementById('container'))
        svgEditor.setConfig({
            initFill: { color: 'none', opacity: 1 },
            initStroke: { color: 'FF0000', opacity: 1, width: 2 },
            imgPath: 'https://cdn.jsdelivr.net/npm/svgedit@7.4.2/dist/editor/images',
            extPath: 'https://cdn.jsdelivr.net/npm/svgedit@7.4.2/dist/editor/extensions',
            allowInitialUserOverride: true,
            extensions: [],
            noDefaultExtensions: false,
            userExtensions: []
        })
        applySvgEditPatch(svgEditor)
    </script>
</body>
</html>
